<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affiliate Prompt Kit 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18212b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:auto;padding:18px}.head{background:#172b4d;color:white;border-radius:20px;padding:20px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 6px}.sub{opacity:.85;font-size:14px}.panel{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #0000000b}
label{font-weight:700;font-size:14px;display:block;margin:10px 0 6px}textarea,input{width:100%;padding:12px;border:1px solid #d6dde5;border-radius:12px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.menu{padding:18px 8px;border:0;border-radius:15px;background:#f7f9fb;font-size:16px;font-weight:800;cursor:pointer}
.menu.active{outline:3px solid #6b8afd;background:#edf1ff}.wide{width:100%;padding:13px;border:0;border-radius:12px;background:#172b4d;color:white;font-weight:800;font-size:15px;margin-top:10px}
.secondary{background:#e8edf3;color:#172b4d}.output{white-space:pre-wrap;line-height:1.65;font-size:14px;min-height:180px;background:#fbfcfd;border:1px solid #e1e7ed;border-radius:12px;padding:14px;overflow-wrap:anywhere}
small{color:#667585}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<main>
<section class="head"><h1>📦 Affiliate Prompt Kit 2.0</h1><div class="sub">เครื่องมือรวม Prompt สำหรับคอนเทนต์ Affiliate • Mobile Friendly</div></section>

<section class="panel">
<label for="product">📋 รายละเอียดสินค้า</label>
<textarea id="product" rows="7" placeholder="ชื่อสินค้า:
แบรนด์ / รุ่น / สี / ขนาด:
จุดเด่น:
วิธีใช้งาน:
กลุ่มลูกค้า:
ปัญหาของลูกค้า:
สถานที่ถ่ายทำ:
ตัวละคร:
ข้อเสนอจริง:
ข้อห้ามในการกล่าวอ้าง:"></textarea>
<label for="extra">📷 รายละเอียดภาพอ้างอิง / ข้อกำหนดเพิ่มเติม</label>
<textarea id="extra" rows="3" placeholder="เช่น ต้องตรงกับภาพ 100%, รักษาโลโก้ สี รูปทรง ชิ้นส่วน และสัดส่วน"></textarea>
</section>

<section class="panel">
<div class="row"><strong>เลือกชุด Prompt</strong><small id="selected">MASTER</small></div>
<div class="grid" style="margin-top:10px">
<button class="menu active" data-type="MASTER">🟦 MASTER</button>
<button class="menu" data-type="IMAGE">🟩 IMAGE</button>
<button class="menu" data-type="VIDEO">🟨 VIDEO</button>
<button class="menu" data-type="SCRIPT">🟧 SCRIPT</button>
<button class="menu" data-type="CAPTION">🟪 CAPTION</button>
<button class="menu" data-type="QC">🟥 QC</button>
</div>
</section>

<section class="panel">
<strong>ผลลัพธ์ Prompt</strong>
<div id="output" class="output" style="margin-top:10px">กรอกรายละเอียดสินค้า แล้วกดเลือกเมนู</div>
<button class="wide" id="copy">📋 คัดลอก Prompt</button>
<button class="wide secondary" id="clear">ล้างข้อมูล</button>
</section>
</main>
<script>
let current="MASTER";
const rules=`กฎสำคัญ:
- สินค้าต้องตรงกับภาพอ้างอิง 100%: โลโก้ สี รูปทรง สัดส่วน วัสดุ ฝา ฉลาก อุปกรณ์ และชิ้นส่วน ห้ามเพิ่มหรือลด
- รักษาความต่อเนื่องของตัวละคร ห้อง มุมกล้อง แสง และตำแหน่งสิ่งของ
- ใช้ภาพแนว realistic / ultra-photorealistic commercial advertising, vertical 9:16
- ห้ามสร้างข้อความบนภาพ ลายน้ำ หรือองค์ประกอบที่ไม่ได้ระบุ
- ห้ามกล่าวอ้างเกินจริง ต้องใช้เฉพาะข้อมูลและข้อเสนอที่ผู้ใช้ให้มา`;

const templates={
MASTER:`คุณคือ AI Creative Director สำหรับสร้างคอนเทนต์ Affiliate

สร้างแพ็กเกจครบชุดสำหรับสินค้า:
{{PRODUCT}}

ข้อมูลเพิ่มเติม:
{{EXTRA}}

ดำเนินการ:
1. วิเคราะห์สินค้าและกลุ่มลูกค้า
2. ระบุ Customer Objection และ Core Message เพียง 1 ข้อ
3. ออกแบบ HOOK 0–3 วินาที
4. ออกแบบ OPEN / TRANSFORMATION 3–9 วินาที
5. ออกแบบ PROOF 9–16 วินาที โดยใช้หลักฐานที่ตรวจสอบได้
6. ออกแบบ CTA 16–22 วินาที
7. Prompt ภาพ Hook / Open / Proof / CTA
8. Video Prompt ฉากต่อเนื่อง
9. สคริปต์เสียงภาษาไทย 20–22 วินาที
10. Caption และ Hashtags
11. QC Checklist

${rules}`,

IMAGE:`สร้าง Prompt ภาพโฆษณา Affiliate สำหรับสินค้า:
{{PRODUCT}}

ข้อมูลเพิ่มเติม:
{{EXTRA}}

สร้าง Prompt ภาษาไทยหรืออังกฤษที่พร้อมนำไปใช้กับ Image AI จำนวน 4 ภาพ:
1. HOOK: แสดงปัญหาหรือความสนใจแรกเห็น
2. OPEN / TRANSFORMATION: แสดง Before และการเปลี่ยนแปลงอย่างชัดเจน
3. PROOF: แสดงการใช้งานจริงหรือหลักฐานที่เหมาะสม
4. CTA: Product Hero พร้อมสินค้าเด่นและบริบทการใช้งาน

ทุกภาพ: realistic commercial lifestyle advertising, vertical 9:16, bright natural lighting.
หากเป็น Before ห้ามแสดงสินค้าเปิดใช้งานหรือติดตั้งก่อนเวลา
หากเป็น After ต้องแสดงผลลัพธ์และชิ้นส่วนครบถ้วน
${rules}`,

VIDEO:`สร้าง Video Prompt สำหรับสินค้า:
{{PRODUCT}}

ข้อมูลเพิ่มเติม:
{{EXTRA}}

รูปแบบวิดีโอแนวตั้ง 9:16 ความยาว 20–22 วินาที:
- 0–3s HOOK: การกระทำหรือภาพที่ดึงดูดความสนใจ พร้อมปัญหาของลูกค้า
- 3–9s OPEN / TRANSFORMATION: Before → ขั้นตอนเปลี่ยนแปลง หรือ Instant Demonstration
- 9–16s PROOF: แสดงการใช้งานจริงอย่างสมเหตุสมผล ห้ามสร้างผลลัพธ์เกินจริง
- 16–22s CTA: สินค้าเด่น Core Message และข้อเสนอจริง พร้อมคำกระตุ้นให้ทำเพียงหนึ่งอย่าง

ระบุ shot, camera movement, action, lighting, continuity และ negative prompt.
ห้ามสินค้าหาย โผล่ หรือประกอบตัวเอง และห้ามมีชิ้นส่วนเกิน/ขาด
${rules}`,

SCRIPT:`เขียนสคริปต์เสียงภาษาไทยความยาว 20–22 วินาที สำหรับสินค้า:
{{PRODUCT}}

ข้อมูลเพิ่มเติม:
{{EXTRA}}

โครงสร้าง:
- HOOK 0–3s: เปิดด้วยปัญหา คำถาม หรือข้อกังวลของลูกค้า
- BODY 3–16s: อธิบายวิธีใช้ จุดเด่น และหลักฐานที่มีจริงอย่างกระชับ
- CTA 16–22s: ย้ำ Core Message ข้อเสนอจริง และให้ผู้ชมทำเพียงหนึ่งการกระทำ

เขียนให้ฟังเป็นธรรมชาติ ไม่เว่อร์ ไม่กล่าวอ้างเกินจริง และแบ่งช่วงเวลาให้ชัดเจน`,

CAPTION:`สร้าง Caption สำหรับ TikTok / Reels ของสินค้า:
{{PRODUCT}}

ข้อมูลเพิ่มเติม:
{{EXTRA}}

ส่งผลลัพธ์:
1. Caption สั้นและดึงดูดความสนใจ
2. ประโยชน์หลักที่ไม่กล่าวอ้างเกินจริง
3. CTA เพียงหนึ่งการกระทำ โดยใช้ข้อเสนอจริงเท่านั้น
4. Hashtags 8–12 รายการที่เกี่ยวข้อง
5. คำเตือนเรื่อง Claim ที่ควรหลีกเลี่ยง หากมีความเสี่ยง`,

QC:`ทำหน้าที่เป็น Quality Control สำหรับคอนเทนต์ Affiliate

ข้อมูลสินค้า:
{{PRODUCT}}

ข้อมูลเพิ่มเติม:
{{EXTRA}}

ตรวจสอบเป็นรายการ:
1. Product Accuracy: รูปทรง สี โลโก้ ฉลาก สัดส่วน วัสดุ ฝา และชิ้นส่วนตรงภาพอ้างอิงหรือไม่
2. Visual Continuity: ห้อง ตัวละคร เสื้อผ้า แสง มุมมอง และตำแหน่งสิ่งของต่อเนื่องหรือไม่
3. Before / After: มีการติดตั้งหรือผลลัพธ์ก่อนเวลาหรือไม่
4. Claim Accuracy: มีคำกล่าวอ้างเกินจริงหรือไม่มีหลักฐานหรือไม่
5. Hook / Proof / CTA: ชัดเจนและเหมาะสมหรือไม่
6. ความปลอดภัยและความสมจริงของการใช้งาน
7. สรุปสิ่งที่ผ่าน สิ่งที่ต้องแก้ และ Prompt ที่ควรปรับปรุง`
};

function build(){
 const product=document.getElementById("product").value.trim()||"[ยังไม่ได้กรอกรายละเอียดสินค้า]";
 const extra=document.getElementById("extra").value.trim()||"[ไม่มีข้อมูลเพิ่มเติม]";
 document.getElementById("output").textContent=templates[current].replace("{{PRODUCT}}",product).replace("{{EXTRA}}",extra);
}
document.querySelectorAll(".menu").forEach(btn=>{
 btn.addEventListener("click",()=>{
  current=btn.dataset.type;
  document.querySelectorAll(".menu").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("selected").textContent=current;
  build();
 });
});
document.getElementById("product").addEventListener("input",build);
document.getElementById("extra").addEventListener("input",build);
document.getElementById("copy").addEventListener("click",async()=>{
 try{await navigator.clipboard.writeText(document.getElementById("output").textContent);alert("คัดลอก Prompt แล้ว");}
 catch(e){alert("ไม่สามารถคัดลอกอัตโนมัติได้ ให้กดค้างที่ข้อความแล้วเลือกคัดลอก");}
});
document.getElementById("clear").addEventListener("click",()=>{
 document.getElementById("product").value="";
 document.getElementById("extra").value="";
 build();
});
build();
</script>
</body>
</html>
